# The name of workflow as it will appear in the GitHub Actions tab
name: Backend CI Pipeline

# This section tells GitHub WHEN to run this script.
on:
  push:
    branches: [ "main", "Induru-dev" ] # Runs when code is pushed to these branches
  pull_request:
    branches: [ "main" ] # Also runs when a Pull Request is opened against main

# A workflow consists of one or more "jobs" that run in the cloud
jobs:
  build-and-test:
    # This tells GitHub to provision a fresh, temporary Ubuntu Linux server for us
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: brightbuy
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    # These are the sequential steps the server will execute
    steps:
    # Step 1: Clone (checkout) your repository's code onto the Ubuntu server
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Install Java 17 on the Ubuntu server
    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # This speeds up builds by caching downloaded dependencies

    # Step 3: Navigate into the Backend folder, give the Maven wrapper execute permissions, and run the tests
    - name: Run Maven Tests
      working-directory: ./Backend
      env:
        BRIGHTBUY_DB_URL: jdbc:mysql://127.0.0.1:3306/brightbuy?useSSL=false
        BRIGHTBUY_DB_USERNAME: root
        BRIGHTBUY_DB_PASSWORD: root
      run: |
        chmod +x mvnw
        ./mvnw clean test