name: Integrated project verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, kavindu/catalogue-database]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Test UI, backend, SQL and real HTTP integration on isolated MySQL
        run: bash scripts/verify-project.sh
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-test-reports
          path: |
            Backend/target/surefire-reports/
            /tmp/brightbuy-verify.*/
          retention-days: 7
