# Opt-in local inventory profile. Import SQL manually; never alter shared tables.
spring.datasource.url=${BRIGHTBUY_DB_URL:jdbc:mysql://localhost:3306/inventory_delivery}
spring.datasource.username=${BRIGHTBUY_DB_USERNAME:root}
spring.datasource.password=${BRIGHTBUY_DB_PASSWORD:Nadun22@#}

# Keep the same settings as the catalogue for consistency
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.noAccessToProcedureBodies=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Allow React Frontend
inventory.cors.allowed-origins=${BRIGHTBUY_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
