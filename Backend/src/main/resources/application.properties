spring.application.name=brightbuy-backend

# Database. Credentials come from the environment and are never committed
# (see Backend/.env.example). The schema is installed from Database/ with
# plain SQL; this application never creates or alters tables.
spring.datasource.url=${BRIGHTBUY_DB_URL:jdbc:mysql://localhost:3306/brightbuy}
spring.datasource.username=${BRIGHTBUY_DB_USERNAME}
spring.datasource.password=${BRIGHTBUY_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=${BRIGHTBUY_DB_POOL_SIZE:4}
# Stored procedures are called with explicit parameters, so the account does
# not need to read routine definitions.
spring.datasource.hikari.data-source-properties.noAccessToProcedureBodies=true
brightbuy.query-timeout-seconds=5

# Sessions (SEC-9): server-side, 30 minutes of inactivity, HTTP-only cookie.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${BRIGHTBUY_SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=${BRIGHTBUY_COOKIE_SAME_SITE:lax}
server.error.include-stacktrace=never
server.error.include-message=never

# Browser origins allowed to call the API.
brightbuy.cors.allowed-origins=${BRIGHTBUY_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Card payments (SRS 3.3.2): "simulated" accepts the gateway's test cards
# only; "disabled" turns card checkout off and leaves cash on delivery working.
brightbuy.payment.gateway=${BRIGHTBUY_PAYMENT_GATEWAY:simulated}

# Queued emails (SRS 3.3.3) are handed to the simulated email service.
brightbuy.email.dispatch-enabled=true
brightbuy.email.dispatch-interval-ms=30000

# First administrator: set both once on an empty system, start the backend,
# then remove them. Leave empty otherwise.
brightbuy.bootstrap-admin.email=${BRIGHTBUY_BOOTSTRAP_ADMIN_EMAIL:}
brightbuy.bootstrap-admin.password=${BRIGHTBUY_BOOTSTRAP_ADMIN_PASSWORD:}
