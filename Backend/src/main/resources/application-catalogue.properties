# Opt-in local catalogue profile. Import SQL manually; never alter shared tables.
spring.datasource.url=${BRIGHTBUY_DB_URL:jdbc:mysql://brightbuy-mysql-2026.mysql.database.azure.com:3306/brightbuy}
spring.datasource.username=${BRIGHTBUY_DB_USERNAME:brightBuy_admin}
spring.datasource.password=${BRIGHTBUY_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
# Explicit parameter binding works without granting access to procedure bodies.
spring.datasource.hikari.data-source-properties.noAccessToProcedureBodies=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false
catalogue.query-timeout-seconds=5
catalogue.cors.allowed-origins=${BRIGHTBUY_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
