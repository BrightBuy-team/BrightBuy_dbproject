# Production settings. Activate with SPRING_PROFILES_ACTIVE=production.
# ProductionSafetyConfiguration refuses to start if these are unsafe.
spring.datasource.url=${BRIGHTBUY_DB_URL}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
server.servlet.session.cookie.secure=true
brightbuy.cors.allowed-origins=${BRIGHTBUY_CORS_ORIGINS}
