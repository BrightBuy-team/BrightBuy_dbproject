# Activate AFTER catalogue,inventory: SPRING_PROFILES_ACTIVE=catalogue,inventory,production
# No shared migrations/seed operations are run by this profile.
spring.datasource.url=${BRIGHTBUY_DB_URL}
spring.datasource.username=${BRIGHTBUY_DB_USERNAME}
spring.datasource.password=${BRIGHTBUY_DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=${BRIGHTBUY_COOKIE_SAME_SITE:lax}
catalogue.cors.allowed-origins=${BRIGHTBUY_CORS_ORIGINS}
inventory.cors.allowed-origins=${BRIGHTBUY_CORS_ORIGINS}
