# Unit and context tests run without MySQL: an empty in-memory database is
# enough to start the application. Real SQL is tested by scripts/verify-project.sh.
spring.datasource.url=jdbc:h2:mem:brightbuy;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
brightbuy.email.dispatch-enabled=false
